# DFD-V3-1 / D-10 — Public Flutter web publish is DISABLED.
# Live /DeeFoodieApp/ must stay Private beta (stub only), not the journal app.
# Re-enable only with Conductor + Auditor approval after a verified beta-token gate deploy.
name: Web Deploy

on:
  workflow_dispatch:
    inputs:
      confirm_public_publish:
        description: 'Type PUBLISH to override D-10 disable (requires Auditor sign-off)'
        required: true
        default: ''

permissions:
  contents: write

concurrency:
  group: web-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # Hard off: even workflow_dispatch stays blocked unless explicitly flipped.
    if: ${{ false }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test
      - run: flutter build web --release --base-href "/DeeFoodieApp/"

      - name: GitHub Pages SPA fallback
        run: |
          cp build/web/index.html build/web/404.html
          touch build/web/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: mobile/build/web
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: 'Deploy Flutter web from ${{ github.sha }}'
