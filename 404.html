<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="DeeFoodie is private beta — invite only. No public install." />
  <title>DeeFoodie — Private beta</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1a14;
      --ink: #d6e0d8;
      --gold: #e8c27a;
      --muted: #8fa396;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, #1a2e1f 0%, transparent 55%),
        var(--bg);
      color: var(--ink);
    }
    main { max-width: 28rem; text-align: center; }
    h1 {
      margin: 0 0 0.35rem;
      font-size: clamp(2rem, 6vw, 2.75rem);
      color: var(--gold);
      letter-spacing: 0.02em;
    }
    .badge {
      display: inline-block;
      margin-bottom: 1.25rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold);
    }
    p {
      margin: 0 0 1rem;
      line-height: 1.55;
      font-size: 1.05rem;
    }
    .muted { color: var(--muted); font-size: 0.95rem; }
    a { color: var(--gold); }
  </style>
</head>
<body>
  <main>
    <p class="badge">Private beta</p>
    <h1>DeeFoodie</h1>
    <p>A private journal of where you eat in Karachi.</p>
    <p class="muted">Invite only. No public install link. The journal app is not published on the web.</p>
    <p class="muted"><a href="privacy.html">Privacy</a> · Hub lists DeeFoodie as Private beta</p>
  </main>
  <script>
    // C-20 harness: private-beta stub is ready without Flutter.
    window.__APP_READY__ = true;
  </script>
</body>
</html>
